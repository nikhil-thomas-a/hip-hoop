<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hip Hoop AI — NBA × Hip-Hop Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
[data-theme="light"]{
  --bg:#F5F2EB;--bg2:#FFFFFF;--bg3:#EDEAD8;--bg4:#E8E4DA;
  --border:#D4CEC0;--border2:#B8B2A4;
  --text:#1A1714;--text2:#6E6760;--text3:#B8B2A4;
  --orange:#D95200;--amber:#B87D00;--orange-light:#FFF0E8;
  --up:#156B3C;--down:#B52626;--neutral:#5C5C58;
  --up-bg:rgba(21,107,60,.1);--down-bg:rgba(181,38,38,.1);--neutral-bg:rgba(92,92,88,.1);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0C0C0A;--bg2:#141210;--bg3:#1C1A16;--bg4:#242018;
  --border:#2C2820;--border2:#3C3830;
  --text:#F0EAD8;--text2:#6A6258;--text3:#3C3830;
  --orange:#FF6B00;--amber:#FFB800;--orange-light:rgba(255,107,0,.1);
  --up:#00C96B;--down:#FF3B3B;--neutral:#888880;
  --up-bg:rgba(0,201,107,.12);--down-bg:rgba(255,59,59,.12);--neutral-bg:rgba(136,136,128,.12);
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{transition:background .3s,color .3s;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(90deg,rgba(180,140,60,.025) 0,rgba(180,140,60,.025) 1px,transparent 1px,transparent 72px),
  repeating-linear-gradient(0deg,rgba(180,140,60,.018) 0,rgba(180,140,60,.018) 1px,transparent 1px,transparent 96px);}

/* ── SITE HEADER ── */
.site-header{background:var(--bg2);border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.site-header::before{content:'';position:absolute;top:-60px;left:-60px;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,var(--orange-light) 0%,transparent 65%);pointer-events:none;opacity:.6;z-index:0;}
.site-header-inner{max-width:960px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:72px;position:relative;z-index:1;gap:16px;}
.site-logo-link{text-decoration:none;display:flex;align-items:baseline;gap:6px;}
.site-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5vw,40px);line-height:1;color:var(--text);letter-spacing:.03em;}
.site-logo span{color:var(--orange);}
.site-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  background:var(--orange-light);color:var(--orange);border:1px solid var(--orange);border-radius:3px;padding:2px 8px;
  white-space:nowrap;align-self:center;margin-left:4px;}
.site-header-gap{flex:1;}
.site-back{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  text-decoration:none;color:var(--text2);display:flex;align-items:center;gap:6px;transition:color .15s;white-space:nowrap;}
.site-back:hover{color:var(--orange);}
.site-back::before{content:'←';font-size:13px;}

/* ── THEME TOGGLE ── */
.theme-toggle{background:var(--bg2);border:1px solid var(--border);border-radius:24px;
  padding:7px 14px 7px 10px;display:flex;align-items:center;gap:9px;
  cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text2);transition:all .2s;user-select:none;box-shadow:var(--shadow);border:none;
  background:var(--bg3);border:1px solid var(--border);}
.theme-toggle:hover{border-color:var(--border2);color:var(--text);}
.tt-track{width:30px;height:17px;background:var(--border);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0;}
.tt-track.on{background:var(--orange);}
.tt-thumb{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tt-track.on .tt-thumb{transform:translateX(13px);}
.tt-lbl{}
@media(max-width:500px){.tt-lbl{display:none;}.theme-toggle{padding:7px 10px;}}

/* ── APP SHELL ── */
.app-shell{max-width:960px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:1;}
@media(max-width:600px){.app-shell{padding:24px 16px 60px;}}

/* ── KEY BANNER ── */
.key-banner{background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:14px 18px;margin-bottom:24px;display:flex;align-items:flex-start;gap:12px;
  box-shadow:var(--shadow);}
.key-banner.set{background:var(--up-bg);border-color:rgba(21,107,60,.3);}
[data-theme="dark"] .key-banner.set{border-color:rgba(0,201,107,.25);}
.key-icon{font-size:16px;flex-shrink:0;padding-top:2px;}
.key-input-wrap{flex:1;display:flex;gap:8px;flex-wrap:wrap;}
.key-input{flex:1;min-width:180px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  font-size:13px;font-family:'SFMono-Regular',Consolas,monospace;color:var(--text);outline:none;transition:border-color .15s;}
.key-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-light);}
.key-btn{padding:9px 16px;background:var(--orange);color:#fff;border:none;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.key-btn:hover:not(:disabled){opacity:.88;}
.key-btn:disabled{opacity:.5;cursor:not-allowed;}
.key-btn.outline{background:none;border:1px solid var(--border);color:var(--text2);}
.key-btn.outline:hover{border-color:var(--border2);color:var(--text);}
.key-set-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--up);flex:1;}
[data-theme="dark"] .key-set-label{color:var(--up);}
.key-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;}
.key-hint a{color:var(--orange);text-decoration:none;}
.key-hint a:hover{text-decoration:underline;}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:14px 20px;cursor:pointer;color:var(--text2);border:none;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange);}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:24px;box-shadow:var(--shadow);}

/* ── PREDICT LAYOUT ── */
.predict-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start;}
@media(max-width:720px){.predict-layout{grid-template-columns:1fr;}}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1/-1;}
.form-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--text2);}
.form-input,.form-select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;}
.form-input:focus,.form-select:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-light);}
.form-input::placeholder{color:var(--text3);}

/* ── PREDICT BUTTON ── */
.predict-btn{width:100%;margin-top:20px;padding:13px 20px;background:var(--orange);color:#fff;border:none;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s,transform .1s;}
.predict-btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px);}
.predict-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}

/* ── RESULT ── */
.result-area{margin-top:24px;border-top:1px solid var(--border);padding-top:24px;}
.result-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--text2);margin-bottom:14px;}
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.metric-card{border-left:3px solid var(--border);border-radius:0 4px 4px 0;padding:14px 16px;background:var(--bg3);}
.metric-card.m-up{border-left-color:var(--up);}
.metric-card.m-down{border-left-color:var(--down);}
.metric-card.m-neutral{border-left-color:var(--border2);}
.metric-val{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;}
.metric-val.up{color:var(--up);}
.metric-val.down{color:var(--down);}
.metric-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--text2);margin-top:4px;}
.confidence-wrap{margin-bottom:20px;}
.conf-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.conf-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--text2);}
.conf-pct{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;}
.bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .8s ease;}
.ai-box{border-left:3px solid var(--orange);padding:14px 18px;background:var(--orange-light);border-radius:0 4px 4px 0;}
.ai-box-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--orange);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.ai-pulse{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block;
  animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);}}
.ai-text{font-size:14px;line-height:1.8;color:var(--text);}
.error-msg{margin-top:12px;color:var(--down);font-size:13px;background:var(--down-bg);border:1px solid rgba(181,38,38,.25);border-radius:4px;padding:12px 14px;line-height:1.6;}

/* ── SIDEBAR ── */
.sidebar{display:flex;flex-direction:column;gap:12px;}
.sidebar-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;box-shadow:var(--shadow);}
.sidebar-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--orange);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.sidebar-title::before{content:'';display:inline-block;width:10px;height:2px;background:var(--orange);}
.ref-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.ref-row:last-child{border-bottom:none;padding-bottom:0;}
.ref-label{font-size:12px;color:var(--text2);font-weight:300;}
.ref-val{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.ref-val.up{color:var(--up);}
.ref-val.down{color:var(--down);}
.ref-val.orange{color:var(--orange);}

.stat-fact{padding:10px 0;border-bottom:1px solid var(--border);}
.stat-fact:last-child{border-bottom:none;padding-bottom:0;}
.stat-fact-num{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:var(--orange);}
.stat-fact-text{font-size:12px;color:var(--text2);font-weight:300;margin-top:2px;line-height:1.5;}

/* ── NO KEY STATE ── */
.no-key{text-align:center;padding:48px 20px;color:var(--text2);}
.no-key-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text);margin-bottom:8px;letter-spacing:.04em;}
.no-key-sub{font-size:14px;font-weight:300;line-height:1.7;}

/* ── CHAT ── */
.chat-wrap{display:flex;flex-direction:column;height:520px;}
@media(max-width:600px){.chat-wrap{height:420px;}}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.chip{padding:5px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;
  cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap;}
.chip:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-light);}
.messages{flex:1;overflow-y:auto;padding:0 0 12px;display:flex;flex-direction:column;gap:14px;}
.messages::-webkit-scrollbar{width:3px;}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{display:flex;gap:10px;align-items:flex-start;}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:11px;flex-shrink:0;letter-spacing:.04em;}
.msg-avatar.ai{background:var(--orange);color:#fff;}
.msg-avatar.user{background:var(--bg4);color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.msg-bubble{max-width:80%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.7;}
.msg-bubble.ai{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px 14px 14px 14px;}
.msg-bubble.user{background:var(--orange);color:#fff;border-radius:14px 4px 14px 14px;}
.chat-input-row{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:14px;margin-top:auto;}
.chat-input{flex:1;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;}
.chat-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-light);}
.chat-input::placeholder{color:var(--text3);}
.send-btn{padding:11px 20px;background:var(--orange);color:#fff;border:none;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.send-btn:hover:not(:disabled){opacity:.88;}
.send-btn:disabled{opacity:.5;cursor:not-allowed;}
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── FOOTER ── */
.site-footer{border-top:3px solid var(--orange);padding:20px 24px;background:var(--bg2);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  max-width:none;}
.footer-brand{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--text2);text-transform:uppercase;}
.footer-brand span{color:var(--orange);}
.footer-note{font-size:11px;color:var(--text3);font-style:italic;}
</style>
</head>
<body>

<!-- SITE HEADER -->
<header class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="site-logo-link">
      <span class="site-logo">HIP <span>HOOP</span></span>
    </a>
    <span class="site-badge">AI Predictor</span>
    <div class="site-header-gap"></div>
    <a href="index.html" class="site-back">Dashboard</a>
    <button class="theme-toggle" id="themeToggle">
      <div class="tt-track" id="ttTrack"><div class="tt-thumb"></div></div>
      <span class="tt-lbl" id="themeLabel">Dark</span>
    </button>
  </div>
</header>

<div id="root"></div>

<footer class="site-footer">
  <div class="footer-brand"><span>HIP HOOP</span> AI — Powered by Claude</div>
  <div class="footer-note">Predictions are model estimates — not statistical guarantees.</div>
</footer>

<script>
let isDark = false;
document.getElementById('themeToggle').addEventListener('click', function(){
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
  document.getElementById('ttTrack').classList.toggle('on', isDark);
});
</script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const STORAGE_KEY = "hiphoop_api_key";
const API_URL = "https://api.anthropic.com/v1/messages";

const SYSTEM_PROMPT = `You are the Hip Hoop AI assistant. Hip Hoop is a data science project that analyzes NBA player performance before and after they are mentioned in hip-hop songs. The dataset covers ~110 real hip-hop NBA mentions from 1992–2022.

Key findings from the dataset:
- Players mentioned in hype/positive tracks see an average +2.1 PPG boost in the 2-week window post-mention
- Mentions during playoff runs show the strongest correlation (+3.4 PPG avg)
- Era matters: 1990s mentions (low-pace era) had smaller absolute stat changes vs 2010s+
- Top mentioned players: LeBron James (14 mentions), Kobe Bryant (11), Allen Iverson (8), Kevin Durant (7)
- Rappers from the player's home city show 40% stronger mention-to-performance correlation
- Critical/diss mentions show slight negative correlation (-0.8 PPG on average)
- Sentiment scores (VADER) range from -1 (diss) to +1 (pure hype), median is +0.62
- Statistical tests used: paired t-test, Mann-Whitney U, Pearson correlation, OLS regression
- Era normalization accounts for pace differences between decades

Answer questions about the Hip Hoop dataset, methodology, and findings. Be concise, specific, and data-driven. Reference actual stats when possible.`;

async function callClaude(messages, apiKey, system) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: system || SYSTEM_PROMPT,
      messages
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content?.[0]?.text || "";
}

function KeyBanner({ apiKey, setApiKey }) {
  const [draft, setDraft] = useState("");
  const [show, setShow] = useState(false);

  function save() {
    const k = draft.trim();
    if (!k.startsWith("sk-")) return;
    localStorage.setItem(STORAGE_KEY, k);
    setApiKey(k);
    setDraft("");
  }

  if (apiKey) return (
    <div className="key-banner set">
      <span className="key-icon">🔑</span>
      <span className="key-set-label">API key saved — ready to analyze</span>
      <button className="key-btn outline" onClick={() => { localStorage.removeItem(STORAGE_KEY); setApiKey(""); }}>Remove</button>
    </div>
  );

  return (
    <div className="key-banner">
      <span className="key-icon">🔑</span>
      <div style={{flex:1}}>
        <div className="key-input-wrap">
          <input
            className="key-input"
            type={show ? "text" : "password"}
            placeholder="Paste your Anthropic API key (sk-ant-...)"
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onKeyDown={e => e.key === "Enter" && save()}
          />
          <button className="key-btn outline" onClick={() => setShow(s => !s)}>{show ? "Hide" : "Show"}</button>
          <button className="key-btn" onClick={save} disabled={!draft.startsWith("sk-")}>Save</button>
        </div>
        <p className="key-hint">
          Stored in your browser only — never sent anywhere except the Anthropic API. &nbsp;
          <a href="https://console.anthropic.com/keys" target="_blank" rel="noopener">Get a key →</a>
        </p>
      </div>
    </div>
  );
}

const REF_STATS = [
  { label: "Avg hype boost (2-week)", val: "+2.1", unit: "PPG", cls: "up" },
  { label: "Playoff mention multiplier", val: "+3.4", unit: "PPG", cls: "up" },
  { label: "Diss track penalty", val: "−0.8", unit: "PPG", cls: "down" },
];

const DATASET_FACTS = [
  { num: "110+", text: "Verified mention windows, 1992–2022" },
  { num: "62%", text: "Of mentions show positive composite impact" },
  { num: "r = 0.31", text: "Correlation between artist tier and PPG delta" },
  { num: "3×", text: "Stronger effect for hometown-artist mentions" },
];

const SUGGESTIONS = [
  "Which player got the biggest boost?",
  "Do playoff mentions hit different?",
  "What's the methodology?",
  "Who is mentioned most by rappers?",
];

function PredictTab({ apiKey }) {
  const [form, setForm] = useState({
    player: "", rapper: "", song: "",
    sentiment: "hype", era: "2010s", position: "Guard", context: ""
  });
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  async function predict() {
    if (!form.player || !form.rapper || !apiKey) return;
    setLoading(true);
    setResult(null);
    try {
      const prompt = `Analyze this hip-hop NBA mention for the Hip Hoop model:

Player: ${form.player}
Rapper/Artist: ${form.rapper}
Song: ${form.song || "unknown"}
Mention sentiment: ${form.sentiment}
Era: ${form.era}
Position: ${form.position}
Context: ${form.context || "none provided"}

Based on Hip Hoop dataset patterns, predict:
1. Likely PPG change as a single number (e.g. 2.1 or -0.5)
2. AST change as a single number
3. REB change as a single number
4. Boost probability 0-100 as an integer
5. A 2-sentence explanation of why this mention would or would not boost performance

Respond ONLY in this exact JSON format with no markdown, preamble, or extra text:
{"ppg": 2.1, "ast": 0.4, "reb": 0.3, "confidence": 72, "explanation": "your explanation here"}`;

      const raw = await callClaude([{ role: "user", content: prompt }], apiKey, SYSTEM_PROMPT);
      const clean = raw.replace(/```json|```/g, "").trim();
      setResult(JSON.parse(clean));
    } catch (e) {
      setResult({ error: e.message || "Could not generate prediction. Check your API key and try again." });
    }
    setLoading(false);
  }

  const Sidebar = () => (
    <div className="sidebar">
      <div className="sidebar-card">
        <div className="sidebar-title">Dataset benchmarks</div>
        {REF_STATS.map(s => (
          <div className="ref-row" key={s.label}>
            <span className="ref-label">{s.label}</span>
            <span className={`ref-val ${s.cls}`}>{s.val}<span style={{fontSize:'13px',fontFamily:"'Barlow Condensed'"}}> {s.unit}</span></span>
          </div>
        ))}
      </div>
      <div className="sidebar-card">
        <div className="sidebar-title">Key stats</div>
        {DATASET_FACTS.map(f => (
          <div className="stat-fact" key={f.num}>
            <div className="stat-fact-num">{f.num}</div>
            <div className="stat-fact-text">{f.text}</div>
          </div>
        ))}
      </div>
    </div>
  );

  if (!apiKey) return (
    <div className="predict-layout">
      <div className="card no-key">
        <div className="no-key-title">API Key Required</div>
        <div className="no-key-sub">Enter your Anthropic API key above to start predicting performance impacts.</div>
      </div>
      <Sidebar />
    </div>
  );

  const confColor = result && !result.error
    ? result.confidence >= 70 ? "var(--up)" : result.confidence >= 50 ? "var(--amber)" : "var(--down)"
    : "var(--orange)";

  return (
    <div className="predict-layout">
      <div className="card">
        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">NBA Player</label>
            <input className="form-input" placeholder="e.g. LeBron James" value={form.player} onChange={e => set("player", e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Rapper / Artist</label>
            <input className="form-input" placeholder="e.g. Drake" value={form.rapper} onChange={e => set("rapper", e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Song (optional)</label>
            <input className="form-input" placeholder="e.g. Forever" value={form.song} onChange={e => set("song", e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Sentiment</label>
            <select className="form-select" value={form.sentiment} onChange={e => set("sentiment", e.target.value)}>
              <option value="hype">Hype / Positive</option>
              <option value="neutral">Neutral / Passing</option>
              <option value="critical">Critical / Diss</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Era</label>
            <select className="form-select" value={form.era} onChange={e => set("era", e.target.value)}>
              <option>1990s</option>
              <option>2000s</option>
              <option>2010s</option>
              <option>2020s</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Position</label>
            <select className="form-select" value={form.position} onChange={e => set("position", e.target.value)}>
              <option>Guard</option>
              <option>Forward</option>
              <option>Center</option>
            </select>
          </div>
          <div className="form-group full">
            <label className="form-label">Context (optional)</label>
            <input className="form-input" placeholder="e.g. playoff run, hometown rapper, comeback season…" value={form.context} onChange={e => set("context", e.target.value)} />
          </div>
        </div>

        <button className="predict-btn" onClick={predict} disabled={loading || !form.player || !form.rapper}>
          {loading ? <><span className="spinner" /> Analyzing mention…</> : <>Predict Performance Impact →</>}
        </button>

        {result && !result.error && (
          <div className="result-area">
            <div className="result-label">Predicted 30-game delta</div>
            <div className="metrics-row">
              {[["ppg","PPG Change"],["ast","AST Change"],["reb","REB Change"]].map(([k,lbl]) => (
                <div className={`metric-card ${result[k] >= 0 ? "m-up" : "m-down"}`} key={k}>
                  <div className={`metric-val ${result[k] >= 0 ? "up" : "down"}`}>
                    {result[k] >= 0 ? "+" : ""}{Number(result[k]).toFixed(1)}
                  </div>
                  <div className="metric-lbl">{lbl}</div>
                </div>
              ))}
            </div>
            <div className="confidence-wrap">
              <div className="conf-header">
                <span className="conf-label">Boost probability</span>
                <span className="conf-pct" style={{color:confColor}}>{result.confidence}%</span>
              </div>
              <div className="bar-track">
                <div className="bar-fill" style={{width:`${result.confidence}%`,background:confColor}} />
              </div>
            </div>
            <div className="ai-box">
              <div className="ai-box-label"><span className="ai-pulse"></span>Claude's analysis</div>
              <div className="ai-text">{result.explanation}</div>
            </div>
          </div>
        )}
        {result?.error && <div className="error-msg">{result.error}</div>}
      </div>
      <Sidebar />
    </div>
  );
}

function ChatTab({ apiKey }) {
  const [messages, setMessages] = useState([
    { role: "assistant", text: "What's good. Ask me anything about the Hip Hoop dataset — player stats, methodology, trends, or the biggest moments in the data." }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  async function send(text) {
    const q = (text || input).trim();
    if (!q || !apiKey) return;
    setInput("");
    const next = [...messages, { role: "user", text: q }];
    setMessages(next);
    setLoading(true);
    try {
      const apiMsgs = next.slice(1).map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.text }));
      const reply = await callClaude(apiMsgs, apiKey, SYSTEM_PROMPT);
      setMessages([...next, { role: "assistant", text: reply }]);
    } catch (e) {
      setMessages([...next, { role: "assistant", text: "Something went wrong: " + (e.message || "unknown error") }]);
    }
    setLoading(false);
  }

  if (!apiKey) return (
    <div className="card no-key">
      <div className="no-key-title">API Key Required</div>
      <div className="no-key-sub">Enter your Anthropic API key above to chat with Hip Hoop AI.</div>
    </div>
  );

  return (
    <div className="card chat-wrap">
      <div className="chips">
        {SUGGESTIONS.map(s => (
          <span key={s} className="chip" onClick={() => send(s)}>{s}</span>
        ))}
      </div>
      <div className="messages">
        {messages.map((m, i) => (
          <div key={i} className={`msg ${m.role === "user" ? "user" : ""}`}>
            <div className={`msg-avatar ${m.role === "user" ? "user" : "ai"}`}>
              {m.role === "user" ? "U" : "HH"}
            </div>
            <div className={`msg-bubble ${m.role === "user" ? "user" : "ai"}`}>{m.text}</div>
          </div>
        ))}
        {loading && (
          <div className="msg">
            <div className="msg-avatar ai">HH</div>
            <div className="msg-bubble ai">
              <div className="typing-dots">
                <span className="typing-dot"/><span className="typing-dot"/><span className="typing-dot"/>
              </div>
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>
      <div className="chat-input-row">
        <input
          className="chat-input"
          placeholder="Ask about Hip Hoop data…"
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && !loading && send()}
          disabled={loading}
        />
        <button className="send-btn" onClick={() => send()} disabled={loading || !input.trim()}>Send</button>
      </div>
    </div>
  );
}

function App() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(STORAGE_KEY) || "");
  const [tab, setTab] = useState("predict");

  return (
    <div className="app-shell">
      <KeyBanner apiKey={apiKey} setApiKey={setApiKey} />
      <div className="tabs">
        <button className={`tab-btn ${tab === "predict" ? "active" : ""}`} onClick={() => setTab("predict")}>Predict Impact</button>
        <button className={`tab-btn ${tab === "chat" ? "active" : ""}`} onClick={() => setTab("chat")}>Ask Hip Hoop AI</button>
      </div>
      {tab === "predict" ? <PredictTab apiKey={apiKey} /> : <ChatTab apiKey={apiKey} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
